<div class="container mx-auto p-4 border rounded">
  <h1 class="text-2xl font-bold">Lista de Áreas <i class="fa-solid fa-plus cursor-pointer" (click)="openRegisterModal()"></i></h1>
  <div *ngFor="let area of areas" class="mt-4 p-4 bg-gray-100 rounded flex items-center justify-between">
    <span class="text-lg">{{ area.name }}</span>
    <div class="flex gap-4">
      <i class="fa-solid fa-pen-to-square cursor-pointer"></i>
      <i class="fa-solid fa-user-plus cursor-pointer"></i>
    </div>
  </div>

  <!-- Modal del registro de área -->
  <app-register-area *ngIf="showRegisterModal" (closeModal)="closeRegisterModal($event)"></app-register-area>

  <!-- Modal de éxito -->
  <div *ngIf="showSuccessModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full text-center">
      <i class="fa-solid fa-circle-check text-green-500 text-4xl mb-4"></i>
      <p class="text-xl">Área registrada exitosamente.</p>
      <button class="bg-teal-500 text-white py-2 px-4 mt-4 rounded" (click)="closeSuccessModal()">Aceptar</button>
    </div>
  </div>
</div>
