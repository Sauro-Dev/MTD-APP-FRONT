<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded shadow-lg max-w-md w-full">
    <h2 class="text-xl font-bold mb-4">Registrar Área</h2>
    <form (ngSubmit)="registerArea()">
      <div class="mb-4">
        <label for="area-name" class="block">Nombre de Área</label>
        <input id="area-name" [(ngModel)]="name" name="name" class="w-full border p-2 rounded" placeholder="Nombre de Área">
      </div>
      <div class="mb-4">
        <label for="area-color" class="block">Color</label>
        <input id="area-color" type="color" [(ngModel)]="color" name="color" class="w-full border p-2 rounded">
      </div>
      <div class="flex gap-4">
        <button type="submit" class="bg-pink-500 text-white py-2 px-4 rounded">Confirmar</button>
        <button type="button" class="bg-teal-500 text-white py-2 px-4 rounded" (click)="cancel()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
