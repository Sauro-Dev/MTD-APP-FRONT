<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
    <h2 class="text-2xl font-bold mb-4 text-[#ED117F]">Registrar Área</h2>
    <form (ngSubmit)="registerArea()">
      <div class="mb-6">
        <label for="area-name" class="block font-medium text-gray-700 mb-1">Nombre de Área</label>
        <input id="area-name" [(ngModel)]="name" name="name" class="w-full border-2 border-gray-300 p-3 rounded-lg focus:border-[#ED117F]" placeholder="Nombre de Área">
      </div>
      <div class="mb-6">
        <label for="area-color" class="block font-medium text-gray-700 mb-1">Color</label>
        <div class="flex items-center">
          <input type="text" [(ngModel)]="color" name="colorText" class="mr-4 w-full border-2 p-3 rounded-lg focus:border-[#ED117F]">
          <input id="area-color" type="color" [(ngModel)]="color" name="color" class="w-12 h-12 p-1 rounded-full">
        </div>
      </div>
      <div class="flex gap-6 justify-center mt-6">
        <button type="submit" class="bg-[#ED117F] text-white font-bold py-2 px-6 rounded-full shadow-md hover:bg-[#c90f6c] transition duration-200">Confirmar</button>
        <button type="button" class="bg-teal-500 text-white font-bold py-2 px-6 rounded-full shadow-md hover:bg-teal-400 transition duration-200" (click)="cancel()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
