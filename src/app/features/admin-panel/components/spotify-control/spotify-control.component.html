<!-- Contenedor principal centrado (opcional), con fondo blanco, borde y sombra -->
<div class="p-4 w-full max-w-5xl mx-auto bg-white rounded-lg shadow">
  <!-- Título -->
  <h2 class="text-2xl font-bold mb-4">Playlists actuales</h2>

  <!-- Carrusel o mensaje si no hay playlists -->
  <div class="relative min-h-[200px] mb-6">
    <ng-container *ngIf="playlists && playlists.length > 0; else noPlaylists">
      <!-- Flecha Izquierda (solo se muestra si arrowLeftVisible es true) -->
      <button
        *ngIf="arrowLeftVisible"
        (click)="scrollLeft()"
        class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white rounded-full p-2 shadow
               hover:bg-gray-100 transition-colors"
      >
        <!-- Ícono de flecha -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>

      <!-- Contenedor con scroll horizontal -->
      <div
        #scrollableContainer
        class="overflow-x-auto flex space-x-4 px-12 scrollbar-hide"
        style="scroll-behavior: smooth;"
      >
        <!-- Tarjetas de playlists -->
        <div
          *ngFor="let pl of playlists"
          class="shrink-0 w-64 border rounded p-3 shadow flex flex-col items-center"
        >
          <iframe
            class="rounded-md"
            style="border-radius:12px"
            [src]="safeEmbed(pl.embedUrl)"
            width="100%"
            height="152"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
          ></iframe>
          <p class="mt-2 font-semibold text-center">{{ pl.title }}</p>
          <div class="flex gap-2 mt-3">
            <button
              class="bg-secondary text-black px-2 py-1 rounded hover:bg-pink-600"
              (click)="edit(pl)"
            >
              Editar
            </button>
            <button
              class="bg-primary text-white px-2 py-1 rounded hover:bg-pink-600"
              (click)="pl.enabled ? disable(pl) : enable(pl)"
            >
              {{ pl.enabled ? 'Deshabilitar' : 'Habilitar' }}
            </button>
          </div>
        </div>
      </div>

      <!-- Flecha Derecha (solo se muestra si arrowRightVisible es true) -->
      <button
        *ngIf="arrowRightVisible"
        (click)="scrollRight()"
        class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white rounded-full p-2 shadow
               hover:bg-gray-100 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </ng-container>

    <!-- Mensaje si no hay playlists (ng-template) -->
    <ng-template #noPlaylists>
      <div *ngIf="message" class="text-gray-500">
        {{ message }}
      </div>
    </ng-template>
  </div>

  <!-- Form para agregar playlist -->
  <div class="border rounded p-4 w-full max-w-md">
    <h3 class="text-lg font-bold mb-2">Agregar playlist</h3>
    <label class="block text-sm mb-1" for="playlistTitleInput">Título</label>
    <input
      id="playlistTitleInput"
      type="text"
      [(ngModel)]="newTitle"
      class="border px-2 py-1 w-full mb-2"
      placeholder="Rock Playlist..."
    />
    <label class="block text-sm mb-1" for="playlistEmbedCodeInput">
      Código de inserción (iframe) de Spotify
    </label>
    <textarea
      id="playlistEmbedCodeInput"
      [(ngModel)]="newEmbedCode"
      class="border px-2 py-1 w-full mb-2"
      rows="4"
      placeholder='<iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/XXXXXXXXXX" ... ></iframe>'
    ></textarea>

    <button
      class="bg-secondary text-black px-3 py-2 rounded hover:bg-pink-600"
      (click)="addPlaylist()"
    >
      Agregar
    </button>
  </div>
</div>

<!-- Modal -->
<div
  *ngIf="showModal"
  class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
>
  <div class="bg-white p-6 rounded shadow">
    <p class="mb-4">{{ modalMessage }}</p>
    <button
      class="bg-primary text-white px-4 py-2 rounded"
      (click)="closeModal()"
    >
      Cerrar
    </button>
  </div>
</div>
