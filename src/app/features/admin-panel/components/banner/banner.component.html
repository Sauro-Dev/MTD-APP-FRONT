<div class="p-6 border-2 bg-white shadow-md rounded-md">
  <h1 class="text-2xl font-bold mb-4">BANNER</h1>

  <!-- Banners Actuales -->
  <h2 class="text-xl font-semibold mb-2">Banners actuales</h2>
  <div class="relative w-full max-w-3xl mx-auto">
    <button (click)="prevBanner()" class="absolute left-0 top-1/2 transform -translate-y-1/2 p-2 bg-gray-300 rounded-full">
      ◀
    </button>

    <img *ngIf="banners.length > 0"
         [ngSrc]="getSafeImageUrl()"
         width="800" height="300"
         priority
         alt="Banner"
         class="w-full rounded-md shadow-lg" />

    <button (click)="nextBanner()" class="absolute right-0 top-1/2 transform -translate-y-1/2 p-2 bg-gray-300 rounded-full">
      ▶
    </button>
  </div>

  <button (click)="deleteBanner()"
          class="bg-red-500 text-white px-4 py-2 rounded mt-2"
          [disabled]="banners.length === 0">
    Eliminar
  </button>

  <!-- Agregar Banner -->
  <h2 class="text-xl font-semibold mt-6 mb-2">Agregar Banner</h2>
  <p class="text-gray-600 mb-3">
    Imágenes permitidas de aspect ratio 10:3. Ejemplo: 1000×300px, 1200×360px, 1600×480px, 2000×600px
  </p>

  <!-- Tarjeta con el área de selección/arrastre de imagen -->
  <div class="bg-white shadow-lg rounded-lg p-6 border border-gray-200">
    <div
      class="border-2 border-dashed p-6 text-center cursor-pointer rounded-lg transition"
      [ngClass]="{'border-blue-500 bg-blue-100': draggingBanner, 'border-gray-300 hover:bg-gray-100': !draggingBanner}"
      (click)="fileInput.click()"
      (dragover)="onDragOver($event); draggingBanner = true"
      (dragleave)="draggingBanner = false"
      (drop)="onDrop($event); draggingBanner = false"
    >
      <i class="fa-solid fa-cloud-upload-alt text-4xl text-gray-500 mb-2"></i>
      <p class="text-gray-600 font-semibold">Arrastra o haz clic para subir una imagen</p>
      <input
        type="file"
        class="hidden"
        #fileInput
        (change)="onFileSelected($event)"
        accept="image/png, image/jpeg, image/webp"
      >
    </div>

    <!-- Vista previa de la imagen seleccionada -->
    <div *ngIf="previewImage" class="mt-4 p-3 bg-gray-100 rounded-lg">
      <h3 class="text-lg font-semibold">Vista previa:</h3>
      <img [src]="previewImage" alt="Vista previa" class="w-full max-w-md rounded shadow-md" />
    </div>
  </div>

  <button (click)="uploadBanner()"
          class="bg-[#3DB6B1] text-white px-4 py-2 rounded mt-2"
          [disabled]="!selectedFile">
    Agregar
  </button>
</div>
