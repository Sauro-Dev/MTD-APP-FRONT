<div class="p-6">
  <!-- Breadcrumb -->
  <div class="text-sm text-gray-500 mb-4">
    <span class="font-semibold text-gray-700">Usuarios</span> > Formularios
  </div>

  <h1 class="text-2xl font-bold">Formularios</h1>

  <!-- Botón "Atrás" -->
  <div class="mt-4">
    <button
      class="px-6 py-2 bg-teal-500 text-white rounded-md font-semibold hover:bg-teal-600"
      routerLink="/users">
      Atrás
    </button>
  </div>

  <!-- Controles de búsqueda y filtros -->
  <div class="flex flex-wrap justify-between items-center bg-gray-100 p-4 rounded-md shadow-md mt-6">
    <!-- Input de búsqueda con ícono -->
    <div class="relative w-full max-w-md">
      <input
        type="text"
        class="pl-10 pr-4 py-2 border rounded-md w-full bg-yellow-200"
        placeholder="Buscar..."
      />
      <i class="fa-solid fa-search absolute left-3 top-3 text-gray-600"></i>
    </div>

    <!-- Contenedor de filtros alineado a la derecha -->
    <div class="flex gap-2">
      <select class="px-4 py-2 border rounded-md">
        <option value="">Área</option>
      </select>

      <select class="px-4 py-2 border rounded-md">
        <option value="">Rol</option>
      </select>

      <select class="px-4 py-2 border rounded-md">
        <option value="">10 Form</option>
      </select>
    </div>
  </div>

  <!-- Aquí más adelante irá la tabla de formularios -->

  <!-- Paginación -->
  <div class="flex justify-center mt-6 gap-4">
    <button class="px-4 py-2 bg-pink-500 text-white rounded-md hover:bg-pink-700">
      <i class="fa-solid fa-angle-left"></i>
    </button>
    <span class="px-4 py-2 bg-gray-200 rounded-md">Página 1</span>
    <button class="px-4 py-2 bg-pink-500 text-white rounded-md hover:bg-pink-700">
      <i class="fa-solid fa-angle-right"></i>
    </button>
  </div>
</div>
