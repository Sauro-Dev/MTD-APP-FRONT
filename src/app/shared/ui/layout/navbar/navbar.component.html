<nav class="bg-[#ED117F] p-4 flex items-center justify-between">
  <!-- Logo y título -->
  <div class="flex items-center gap-2 ms-4">
    <img
      ngSrc="/assets/logo.png"
      alt="Logo"
      class="w-[86px] h-auto"
      width="2465"
      height="2503"
    />
    <span class="text-white font-semibold text-2xl uppercase leading-tight">
      Make The <br> Difference
    </span>
  </div>

  <!-- Menú de navegación -->
  <div class="navbar-links flex gap-12">
    <!-- Icono: Usuarios -->
    <a routerLink="/users" class="group relative flex flex-col items-center">
      <div class="p-3 rounded-full transition duration-300 group-hover:bg-white">
        <i class="fa-solid fa-users-gear text-white transition duration-300 group-hover:text-[#ED117F] text-4xl"></i>
      </div>
      <span class="opacity-0 group-hover:opacity-100 transition duration-300 text-white mt-1 text-lg font-medium">Usuarios</span>
    </a>

    <!-- Icono: Calendario -->
    <div class="group relative flex flex-col items-center">
      <div class="p-3 rounded-full transition duration-300 group-hover:bg-white">
        <i class="fa-solid fa-calendar-days text-white transition duration-300 group-hover:text-[#ED117F] text-4xl"></i>
      </div>
      <span class="opacity-0 group-hover:opacity-100 transition duration-300 text-white mt-1 text-lg font-medium">Calendario</span>
    </div>

    <!-- Icono: Áreas con redirección -->
    <a routerLink="/areas" class="group relative flex flex-col items-center">
      <div class="p-3 rounded-full transition duration-300 group-hover:bg-white">
        <i class="fa-solid fa-layer-group text-white transition duration-300 group-hover:text-[#ED117F] text-4xl"></i>
      </div>
      <span class="opacity-0 group-hover:opacity-100 transition duration-300 text-white mt-1 text-lg font-medium">Áreas</span>
    </a>

    <!-- Icono: Asistencias -->
    <div class="group relative flex flex-col items-center">
      <div class="p-3 rounded-full transition duration-300 group-hover:bg-white">
        <i class="fa-solid fa-list-check text-white transition duration-300 group-hover:text-[#ED117F] text-4xl"></i>
      </div>
      <span class="opacity-0 group-hover:opacity-100 transition duration-300 text-white mt-1 text-lg font-medium">Asistencias</span>
    </div>

    <!-- Icono: Panel de control (solo ADMIN) -->
    <a
      *ngIf="isAdmin()"
      routerLink="/admin-panel"
      class="group relative flex flex-col items-center"
    >
      <div class="p-3 rounded-full transition duration-300 group-hover:bg-white">
        <i class="fa-solid fa-gear text-white transition duration-300 group-hover:text-[#ED117F] text-4xl"></i>
      </div>
      <span class="opacity-0 group-hover:opacity-100 transition duration-300 text-white mt-1 text-lg font-medium">Panel de control</span>
    </a>
  </div>

  <!-- Dropdown de usuario -->
  <div class="relative me-4">
    <!-- Botón para abrir el dropdown -->
    <button
      (click)="toggleDropdown($event)"
      class="flex items-center gap-2 text-white hover:text-red-500 transition-colors"
    >
      <i class="fa-solid fa-user text-3xl"></i>
      <i class="fa-solid fa-chevron-down text-sm"></i>
    </button>

    <!-- Contenido del dropdown -->
    <div
      *ngIf="showDropdown"
      class="
        absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg
        border border-gray-200 z-50
      "
    >
      <div class="p-4">
        <!-- Nombre del usuario -->
        <div class="mb-4">
          <p class="text-gray-800 font-medium">
            {{ userDetails?.name }} {{ userDetails?.paternalSurname }}
          </p>
          <p class="text-gray-500 text-sm">{{ userDetails?.email }}</p>
        </div>

        <!-- Botón de logout -->
        <button
          (click)="logout()"
          class="
            w-full px-4 py-2 bg-red-500 text-white rounded-lg
            hover:bg-red-600 transition-colors
          "
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</nav>
