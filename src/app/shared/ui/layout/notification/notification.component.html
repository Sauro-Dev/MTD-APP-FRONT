<div
  *ngIf="notification.show"
  class="fixed top-4 right-4 p-4 rounded-md shadow-lg z-50 max-w-md transition-opacity duration-300"
  [ngClass]="{
        'bg-green-100 text-green-800 border border-green-300': notification.type === 'success',
        'bg-red-100 text-red-800 border border-red-300': notification.type === 'error',
        'bg-blue-100 text-blue-800 border border-blue-300': notification.type === 'info',
        'bg-yellow-100 text-yellow-800 border border-yellow-300': notification.type === 'warning'
      }"
>
  <div class="flex justify-between items-start">
    <div class="flex-1">
      <p>{{ notification.message }}</p>
    </div>
    <button
      (click)="closeNotification()"
      class="ml-4 text-gray-500 hover:text-gray-700"
    >
      &times;
    </button>
  </div>
</div>
